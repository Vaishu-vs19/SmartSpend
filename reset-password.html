<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — SmartSpend</title>
  <meta name="description" content="Reset your SmartSpend account password securely.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20%22100%22%20%22100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Supabase JS Client v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-page-body">

  <div class="auth-page-container">
    <div class="auth-page-card">
      
      <!-- Brand Header -->
      <div class="auth-brand-header">
        <a href="index.html" style="text-decoration: none;">
          <div class="auth-brand-logo">
            <i class="fa-solid fa-key"></i>
          </div>
          <h1 class="auth-brand-title">SmartSpend</h1>
        </a>
        <p class="auth-brand-subtitle" id="flowSubtitle">Reset your account password</p>
      </div>

      <!-- Feedback Alert Banner -->
      <div class="auth-alert" id="authAlert" role="alert">
        <i class="fa-solid fa-circle-exclamation" id="alertIcon"></i>
        <span id="alertMessage"></span>
      </div>

      <!-- FLOW 1: Request Password Reset Form -->
      <form id="requestResetForm" novalidate>
        <p style="font-size: 0.88rem; color: var(--color-text-muted); margin-bottom: 1.25rem; line-height: 1.5;">
          Enter the email address associated with your SmartSpend account. We'll send you a secure link to reset your password.
        </p>

        <!-- Email Input -->
        <div class="auth-form-group">
          <label for="resetEmail" class="auth-form-label">Email Address</label>
          <div class="auth-input-wrapper">
            <input type="email" id="resetEmail" class="auth-input" placeholder="name@domain.com" required autocomplete="email">
            <i class="fa-regular fa-envelope auth-input-icon"></i>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-btn-primary" id="requestResetBtn" style="margin-top: 1.25rem;">
          <span id="reqBtnText"><i class="fa-solid fa-paper-plane"></i> Send Reset Link</span>
          <span id="reqBtnSpinner" style="display: none;"><i class="fa-solid fa-circle-notch spinner-icon"></i> Sending email...</span>
        </button>
      </form>

      <!-- FLOW 2: Set New Password Form (Revealed when recovery token is detected) -->
      <form id="updatePasswordForm" style="display: none;" novalidate>
        <p style="font-size: 0.88rem; color: var(--color-text-muted); margin-bottom: 1.25rem; line-height: 1.5;">
          Create a new strong password for your SmartSpend account.
        </p>

        <!-- New Password Input -->
        <div class="auth-form-group">
          <label for="newPassword" class="auth-form-label">New Password</label>
          <div class="auth-input-wrapper">
            <input type="password" id="newPassword" class="auth-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
            <i class="fa-solid fa-lock auth-input-icon"></i>
            <button type="button" class="auth-toggle-pwd" id="toggleNewPwdBtn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye" id="toggleNewEyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Confirm New Password Input -->
        <div class="auth-form-group">
          <label for="confirmNewPassword" class="auth-form-label">Confirm New Password</label>
          <div class="auth-input-wrapper">
            <input type="password" id="confirmNewPassword" class="auth-input" placeholder="Re-enter your new password" minlength="6" required autocomplete="new-password">
            <i class="fa-solid fa-shield-halved auth-input-icon"></i>
            <button type="button" class="auth-toggle-pwd" id="toggleConfirmNewPwdBtn" aria-label="Toggle confirm password visibility">
              <i class="fa-regular fa-eye" id="toggleConfirmNewEyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="auth-btn-primary" id="updatePwdBtn" style="margin-top: 1.25rem;">
          <span id="updBtnText"><i class="fa-solid fa-check"></i> Update Password</span>
          <span id="updBtnSpinner" style="display: none;"><i class="fa-solid fa-circle-notch spinner-icon"></i> Updating...</span>
        </button>
      </form>

      <!-- Footer Prompt -->
      <div class="auth-footer-prompt">
        Remember your password? <a href="login.html" class="auth-link">Back to Sign In</a>
      </div>

    </div>
  </div>

  <!-- Auth Controller Script -->
  <script src="auth-helper.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const client = AuthHelper.getClient();
      const requestForm = document.getElementById('requestResetForm');
      const updateForm = document.getElementById('updatePasswordForm');
      const subtitle = document.getElementById('flowSubtitle');

      // Check URL hash for recovery tokens
      // When Supabase recovery email is opened, the hash contains #access_token=...&type=recovery
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const isRecovery = hashParams.get('type') === 'recovery' || window.location.hash.includes('type=recovery');

      if (isRecovery) {
        showUpdatePasswordFlow();
      }

      // Also listen for PASSWORD_RECOVERY auth state change from Supabase JS client
      if (client) {
        client.auth.onAuthStateChange(async (event, session) => {
          if (event === 'PASSWORD_RECOVERY') {
            showUpdatePasswordFlow();
          }
        });
      }

      function showUpdatePasswordFlow() {
        requestForm.style.display = 'none';
        updateForm.style.display = 'block';
        subtitle.textContent = 'Set your new password';
        showAlert('Security token verified. Enter your new password below.', 'info');
      }

      // Password visibility toggles
      const toggleNewBtn = document.getElementById('toggleNewPwdBtn');
      const newPwdInput = document.getElementById('newPassword');
      const toggleNewEye = document.getElementById('toggleNewEyeIcon');
      if (toggleNewBtn && newPwdInput) {
        toggleNewBtn.addEventListener('click', () => {
          const isText = newPwdInput.type === 'text';
          newPwdInput.type = isText ? 'password' : 'text';
          toggleNewEye.className = isText ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
        });
      }

      const toggleConfirmNewBtn = document.getElementById('toggleConfirmNewPwdBtn');
      const confirmNewPwdInput = document.getElementById('confirmNewPassword');
      const toggleConfirmNewEye = document.getElementById('toggleConfirmNewEyeIcon');
      if (toggleConfirmNewBtn && confirmNewPwdInput) {
        toggleConfirmNewBtn.addEventListener('click', () => {
          const isText = confirmNewPwdInput.type === 'text';
          confirmNewPwdInput.type = isText ? 'password' : 'text';
          toggleConfirmNewEye.className = isText ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
        });
      }

      // Handler 1: Request Reset Form
      requestForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const email = document.getElementById('resetEmail').value.trim();
        if (!email) {
          showAlert('Please enter your email address.', 'error');
          return;
        }

        const btn = document.getElementById('requestResetBtn');
        const text = document.getElementById('reqBtnText');
        const spinner = document.getElementById('reqBtnSpinner');

        btn.disabled = true;
        text.style.display = 'none';
        spinner.style.display = 'inline-flex';

        try {
          const res = await AuthHelper.requestPasswordReset(email);
          if (res.success) {
            showAlert('Password reset link sent! Check your inbox to set a new password.', 'success');
            requestForm.reset();
          } else {
            showAlert(res.message || 'Failed to send reset email.', 'error');
          }
        } catch (err) {
          showAlert(err.message || 'An error occurred sending reset email.', 'error');
        } finally {
          btn.disabled = false;
          text.style.display = 'inline-flex';
          spinner.style.display = 'none';
        }
      });

      // Handler 2: Update Password Form
      updateForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const newPwd = document.getElementById('newPassword').value;
        const confirmNewPwd = document.getElementById('confirmNewPassword').value;

        if (newPwd.length < 6) {
          showAlert('New password must be at least 6 characters long.', 'error');
          return;
        }
        if (newPwd !== confirmNewPwd) {
          showAlert('Passwords do not match. Please re-enter carefully.', 'error');
          return;
        }

        const btn = document.getElementById('updatePwdBtn');
        const text = document.getElementById('updBtnText');
        const spinner = document.getElementById('updBtnSpinner');

        btn.disabled = true;
        text.style.display = 'none';
        spinner.style.display = 'inline-flex';

        try {
          const res = await AuthHelper.updatePassword(newPwd);
          if (res.success) {
            showAlert('Password updated successfully! Redirecting to sign in...', 'success');
            setTimeout(() => {
              window.location.replace('login.html');
            }, 1200);
          } else {
            showAlert(res.message || 'Failed to update password.', 'error');
            btn.disabled = false;
            text.style.display = 'inline-flex';
            spinner.style.display = 'none';
          }
        } catch (err) {
          showAlert(err.message || 'An error occurred updating password.', 'error');
          btn.disabled = false;
          text.style.display = 'inline-flex';
          spinner.style.display = 'none';
        }
      });

      function showAlert(msg, type = 'error') {
        const alertBox = document.getElementById('authAlert');
        const alertMsg = document.getElementById('alertMessage');
        const alertIcon = document.getElementById('alertIcon');
        alertBox.className = `auth-alert visible ${type}`;
        alertMsg.textContent = msg;
        if (type === 'success') {
          alertIcon.className = 'fa-solid fa-circle-check';
        } else if (type === 'info') {
          alertIcon.className = 'fa-solid fa-circle-info';
        } else {
          alertIcon.className = 'fa-solid fa-circle-exclamation';
        }
      }

      function hideAlert() {
        const alertBox = document.getElementById('authAlert');
        alertBox.className = 'auth-alert';
      }
    });
  </script>
</body>
</html>
